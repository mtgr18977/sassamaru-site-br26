<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clubes — Sassamaru 2026</title>

  <!-- PWA -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#1A4731" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sassamaru" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="../i18n/i18n.js"></script>
  <link rel="stylesheet" href="../shell/shell.css"/>
  <script src="../shell/shell.js"></script>
  <script src="../modelos/model.js"></script>
  <script src="../modelos/competicoes.js"></script>
  <script src="../modelos/simulacao.js"></script>
  <script src="../modelos/clubes.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#F7F6F2; --surface:#FFFFFF; --border:#E2E0D9; --text:#141412; --muted:#7A786F;
      --accent:#1A4731; --accent-lt:#EBF3EE;
      --lib:#1A4731; --sul:#1E40AF; --rel:#991B1B;
      --bad:#991B1B; --bad-lt:#FEE2E2;
      --shadow:0 1px 3px rgba(0,0,0,.08); --radius:6px;
      --mono:'IBM Plex Mono', ui-monospace, monospace; --sans:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    }
    html { font-size: 15px; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 64px; }
    header { padding: 26px 0 20px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
    header p { font: 400 12px/1.4 var(--mono); color: var(--muted); margin-top: 3px; }
    h2.div { font-size: 16px; font-weight: 600; letter-spacing: -.2px; margin: 26px 0 12px; display: flex; align-items: baseline; gap: 10px; }
    h2.div small { font: 400 12px var(--mono); color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .clube { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      font: 500 13px/1.25 var(--sans); color: var(--text); text-align: center; transition: transform .12s, border-color .12s; }
    .clube:hover { transform: translateY(-2px); border-color: var(--accent); }
    .clube:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .clube .escudo { width: 52px; height: 62px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    .err { background: var(--bad-lt); color: var(--bad); border-radius: var(--radius); padding: 12px 14px; font: 400 13px var(--mono); margin-top: 16px; }
    .notes { margin-top: 28px; font: 400 12px/1.6 var(--mono); color: var(--muted); }

    dialog { margin: auto; width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; padding: 0;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .m-head { display: flex; align-items: center; gap: 16px; padding: 22px 52px 18px 22px; border-bottom: 1px solid var(--border); }
    .m-head .escudo { width: 64px; height: 77px; flex: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,.3)); }
    .m-head h3 { font-size: 20px; font-weight: 600; letter-spacing: -.4px; line-height: 1.2; }
    .m-head p { font: 400 12px/1.5 var(--mono); color: var(--muted); margin-top: 4px; }
    .fechar { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; cursor: pointer;
      background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
    .fechar:hover { background: var(--border); color: var(--text); }
    .fechar:focus-visible { outline: 2px solid var(--accent); }
    .m-corpo { padding: 8px 22px 20px; }
    .m-calc { padding: 28px 0; text-align: center; font: 400 13px var(--mono); color: var(--muted); }
    table.chances { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.chances td { padding: 10px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.chances tr:last-child td { border-bottom: 0; }
    td.f-rot { font-weight: 500; font-size: 14px; }
    td.f-rot small { display: block; font: 400 11px var(--mono); color: var(--muted); }
    td.f-bar { width: 38%; padding: 0 12px; }
    .trilho { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .trilho b { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
    td.f-pct { padding-left: 10px; text-align: right; font: 600 15px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .f-lib { background: var(--lib); } .f-sul { background: var(--sul); } .f-rel { background: var(--rel); }
    .proj { display: flex; gap: 10px; margin-top: 14px; }
    .proj div { flex: 1; background: var(--s-sunk, var(--bg)); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; }
    .proj b { display: block; font: 600 17px var(--mono); }
    .proj span { font: 400 11px var(--mono); color: var(--muted); }
    .m-nota { margin-top: 14px; font: 400 11px/1.55 var(--mono); color: var(--muted); }
    @media (max-width: 640px) { .wrap { padding: 0 16px 56px; } .grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Clubes</h1>
    <p>Toque no escudo para ver as chances do clube na temporada.</p>
  </header>
  <div id="secoes"></div>
  <div id="notas" class="notes"></div>
</div>

<dialog id="modal" aria-labelledby="m-nome">
  <button type="button" class="fechar" id="fechar" aria-label="Fechar">×</button>
  <div class="m-head"><span id="m-escudo"></span><div><h3 id="m-nome"></h3><p id="m-sub"></p></div></div>
  <div class="m-corpo" id="m-corpo"></div>
</dialog>

<script>
(function () {
  'use strict';
  var Model = window.BenchModel, Comp = window.Competicoes, Sim = window.Simulacao, Clubes = window.Clubes;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var DIVISOES = ['serie-a', 'serie-b'];
  var SIMULACOES = 10000;

  // Rótulo e cor de cada linha do modal. As posições (de..ate) vêm de `faixasClube` no registro de competições.
  var FAIXAS = {
    'titulo':       { rot: function () { return _t('Título@@faixa'); },         cls: 'f-lib' },
    'g2':           { rot: function () { return _t('G2@@faixa'); },             cls: 'f-lib', dica: function () { return _t('acesso direto'); } },
    'g4':           { rot: function () { return _t('G4@@faixa'); },             cls: 'f-lib' },
    'g6':           { rot: function () { return _t('G6@@faixa'); },             cls: 'f-lib', dica: function () { return _t('acesso ou playoff'); } },
    'g8':           { rot: function () { return _t('G8@@faixa'); },             cls: 'f-lib' },
    'sul':          { rot: function () { return _t('Sul-Americana@@faixa'); },  cls: 'f-sul' },
    'rebaixamento': { rot: function () { return _t('Cair@@faixa'); },           cls: 'f-rel', dica: function (comp) { return comp.id === 'serie-a' ? _t('para a Série B') : _t('para a Série C'); } },
  };

  var estado = {};      // id da divisão → { comp, st, nomes, tabela, sim }
  var aberto = null;    // { id, chave } do clube com o modal aberto

  function parseCsv(texto) {
    var linhas = texto.trim().split(/\r?\n/), cab = linhas[0].split(',');
    return linhas.slice(1).filter(Boolean).map(function (l) {
      var v = l.split(','), o = {};
      cab.forEach(function (c, i) { o[c] = v[i]; });
      return o;
    });
  }

  function carregar(id) {
    var comp = Comp.obter(id);
    return fetch('../' + comp.csv, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(comp.nome + ': HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      var rows = parseCsv(t), st = Model.computeSeasonState(rows), nomes = {};
      // nome de exibição = grafia do CSV (a última vence), indexada pelo nome normalizado do modelo
      rows.forEach(function (r) { nomes[Model.normalizeTeam(r.mandante)] = r.mandante; nomes[Model.normalizeTeam(r.visitante)] = r.visitante; });
      // critérios da CBF: pontos, vitórias, saldo de gols, gols pró
      var tabela = st.teams.slice().sort(function (a, b) {
        var x = st.standings.get(a), y = st.standings.get(b);
        return y.pts - x.pts || y.w - x.w || y.gd - x.gd || y.gf - x.gf || a.localeCompare(b, 'pt');
      });
      estado[id] = { comp: comp, rows: rows, st: st, nomes: nomes, tabela: tabela, sim: null };
    });
  }

  function desenhar() {
    $('secoes').innerHTML = DIVISOES.map(function (id) {
      var d = estado[id], clubes = d.st.teams.slice().sort(function (a, b) { return d.nomes[a].localeCompare(d.nomes[b], 'pt'); });
      return '<h2 class="div">' + esc(d.comp.nome) + ' <small>' + esc(_t('{n} clubes', { n: _n(clubes.length) })) + '</small></h2><div class="grid">' +
        clubes.map(function (t) {
          return '<button type="button" class="clube" data-div="' + id + '" data-clube="' + esc(t) + '">' + Clubes.escudoSvg(t, d.nomes[t]) + '<span>' + esc(d.nomes[t]) + '</span></button>';
        }).join('') + '</div>';
    }).join('');
    $('notas').innerHTML = '<p>' + esc(_t('Os escudos são ilustrações geradas pelo app (cor do clube e sigla), não os brasões oficiais.')) + '</p>';
  }

  // 0,0% e 100% só quando for exato; o resto nunca arredonda para um extremo que não aconteceu
  function pct(p) {
    if (p <= 0) return _n(0) + '%';
    if (p >= 1) return _n(100) + '%';
    var um = { minimumFractionDigits: 1, maximumFractionDigits: 1 };
    if (p < 0.001) return '<' + _n(0.1, um) + '%';
    if (p > 0.999) return '>' + _n(99.9, um) + '%';
    return _n(p * 100, um) + '%';
  }
  function faixaPos(f) { return f.de === f.ate ? _o(f.de) : _o(f.de) + '–' + _o(f.ate); }

  function corpo() {
    var d = estado[aberto.id], chave = aberto.chave, nome = d.nomes[chave], s = d.st.standings.get(chave);
    var pos = d.tabela.indexOf(chave) + 1;
    $('m-escudo').innerHTML = Clubes.escudoSvg(chave, nome);
    $('m-nome').textContent = nome;
    $('m-sub').textContent = _t(d.comp.nome) + ' · ' + _t('{pos} lugar · {pts} pts · {j} jogos', { pos: _o(pos), pts: _n(s.pts), j: _n(s.played) });
    if (d.erro) { $('m-corpo').innerHTML = '<div class="err">' + esc(_t('Não foi possível calcular as chances.')) + ' (' + esc(d.erro) + ')</div>'; return; }
    if (!d.sim) { $('m-corpo').innerHTML = '<div class="m-calc">' + esc(_t('Calculando as chances…')) + '</div>'; return; }
    var ms = d.sim.times[chave], um = { minimumFractionDigits: 1, maximumFractionDigits: 1 };
    var linhas = d.comp.faixasClube.map(function (f) {
      var meta = FAIXAS[f.id], p = Sim.probabilidade(d.sim, chave, f.de, f.ate);
      var dica = faixaPos(f) + (meta.dica ? ' · ' + meta.dica(d.comp) : '');
      return '<tr><td class="f-rot">' + esc(meta.rot()) + '<small>' + esc(dica) + '</small></td>' +
        '<td class="f-bar"><div class="trilho"><b class="' + meta.cls + '" style="width:' + (p * 100).toFixed(1) + '%' + (p > 0 ? '' : ';min-width:0') + '"></b></div></td>' +
        '<td class="f-pct">' + esc(pct(p)) + '</td></tr>';
    }).join('');
    var nota = _t('Simulação de {n} temporadas a partir da tabela atual: é uma probabilidade, não uma previsão.', { n: _n(d.sim.n) });
    if (d.comp.id === 'serie-b') nota += ' ' + _t('Na Série B sobem 4 clubes: os 2 primeiros e os 2 vencedores do playoff entre o 3º e o 6º.');
    $('m-corpo').innerHTML = '<table class="chances"><tbody>' + linhas + '</tbody></table>' +
      '<div class="proj"><div><b>' + esc(_n(ms.pontos, um)) + '</b><span>' + esc(_t('pontos projetados')) + '</span></div>' +
      '<div><b>' + esc(_o(Math.round(ms.posicao))) + '</b><span>' + esc(_t('posição final média')) + '</span></div></div>' +
      '<p class="m-nota">' + esc(nota) + '</p>';
  }

  function abrir(id, chave) {
    aberto = { id: id, chave: chave };
    corpo();
    var m = $('modal');
    if (!m.open) m.showModal();
  }

  // O modelo leva ~0,3 s por divisão: calcula depois do primeiro desenho, para a página aparecer logo.
  function simular() {
    DIVISOES.forEach(function (id) {
      var d = estado[id];
      try {
        var model = Model.buildModel(d.rows, { trainFromSeason: Comp.indiceTreino(d.comp) });
        d.sim = Sim.simularTemporada(Model, model, d.st, { n: SIMULACOES });
      } catch (e) { d.erro = e.message; }
    });
    if (aberto && $('modal').open) corpo();
  }

  $('secoes').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.clube') : null;
    if (b) abrir(b.getAttribute('data-div'), b.getAttribute('data-clube'));
  });
  $('fechar').addEventListener('click', function () { $('modal').close(); });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) $('modal').close(); });   // clique no fundo escurecido
  $('modal').addEventListener('close', function () { aberto = null; });

  Promise.all(DIVISOES.map(carregar)).then(function () {
    desenhar();
    setTimeout(simular, 30);
  }).catch(function (e) {
    $('secoes').innerHTML = '<div class="err">' + esc(_t('Não foi possível carregar os dados.')) + ' (' + esc(e.message) + ')</div>';
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(function () {});
})();
</script>
</body>
</html>
